<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>La Transmisión</title>
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="Estilos.css">
</head>
<body>
    <div class="scanline"></div>

    <div id="device-select" class="screen-container">
        <h1>SELECCIONAR DISPOSITIVO</h1>
        <div class="button-wrapper">
            <button id="device-pc" class="menu-button">COMPUTADORA 💻</button>
            <button id="device-mobile" class="menu-button">CELULAR 📱</button>
        </div>
    </div>

    <div id="main-menu" class="screen-container" style="display: none;">
        <h1>LA TRANSMISIÓN</h1>
        <div class="button-wrapper">
            <button id="play-button" class="menu-button">JUGAR</button>
            <button id="settings-button" class="menu-button">AJUSTES</button>
        </div>
    </div>

    <div id="difficulty-select" class="screen-container" style="display: none;">
        <h1>SELECCIONAR DIFICULTAD</h1>
        <div class="button-wrapper">
            <button id="difficulty-easy" class="menu-button button-easy">FÁCIL</button>
            <button id="difficulty-normal" class="menu-button button-normal">NORMAL</button>
            <button id="difficulty-hard" class="menu-button button-hard">DIFÍCIL</button>
            <button id="difficulty-nightmare" class="menu-button button-nightmare">PESADILLA</button>
            <button id="difficulty-back-button" class="menu-button">VOLVER</button>
        </div>
    </div>

    <div id="name-select" class="screen-container" style="display: none;">
        <h1>IDENTIFICACIÓN</h1>
        <div class="input-wrapper">
            <input type="text" id="input-player-name" class="menu-input" placeholder="NOMBRE JUGADOR *" maxlength="15" autocomplete="off">
            <input type="text" id="input-companion-name" class="menu-input" placeholder="ACOMPAÑANTE (OPC)" maxlength="15" autocomplete="off">
        </div>
        <button id="start-game-final-button" class="menu-button">Confirmar</button>
        <button id="name-back-button" class="menu-button">VOLVER</button>
    </div>

    <div id="settings" class="screen-container" style="display: none;">
        <h1>AJUSTES</h1>
        
        <div class="settings-options">
            <select id="theme-select" class="menu-select">
                <option value="verde-crt">VERDE CRT</option>
                <option value="ambar">ÁMBAR</option>
                <option value="azul">AZUL</option>
                <option value="blanco">BLANCO</option>
                <option value="negro">NEGRO</option>
            </select>

            <button id="change-device-button" class="menu-button">CAMBIAR DISPOSITIVO</button>
            <button id="reset-data-button" class="menu-button button-danger">RESETEAR DATOS</button>
            <button id="back-button" class="menu-button">VOLVER</button>
        </div>
    </div>


    <div class="version-text">Alfa 2.0</div>


    <script src="Logica.js" type="module"></script>

    <!-- NUEVO: Script para la música de fondo del menú -->
    <script>
        const menuAudio = new Audio('./Assets/Audios/Fondo.mp3');
        const menuAudioVolume = 0.3; // Ajusta el volumen aquí (de 0.0 a 1.0)
        const audioTimeKey = 'menu-audio-time';

        menuAudio.loop = true;
        menuAudio.volume = menuAudioVolume;

        // Función para iniciar la música (requiere interacción del usuario)
        const playMenuMusic = () => {
            // Reanudar desde la posición guardada si existe
            const savedTime = sessionStorage.getItem(audioTimeKey);
            if (savedTime) {
                menuAudio.currentTime = parseFloat(savedTime);
            }
            menuAudio.play().catch(e => console.log("El navegador requiere interacción para reproducir audio."));
            // Una vez que la música empieza, ya no necesitamos este listener
            document.body.removeEventListener('click', playMenuMusic);
        };

        // Guardar la posición del audio al salir de la página
        window.addEventListener('beforeunload', () => {
            sessionStorage.setItem(audioTimeKey, menuAudio.currentTime);
        });

        // Esperar a que el usuario haga clic en cualquier lugar para iniciar la música
        document.body.addEventListener('click', playMenuMusic);
    </script>
</body>
</html>
