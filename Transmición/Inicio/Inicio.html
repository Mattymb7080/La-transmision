<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>La Transmisión</title>
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="Estilos.css">
</head>
<body>
    <div class="scanline"></div>

    <div id="device-select" class="screen-container">
        <h1>SELECCIONAR DISPOSITIVO</h1>
        <div class="button-wrapper">
            <button id="device-pc" class="menu-button">COMPUTADORA 💻</button>
            <button id="device-mobile" class="menu-button">CELULAR 📱</button>
        </div>
    </div>

    <div id="main-menu" class="screen-container" style="display: none;">
        <h1>LA TRANSMISIÓN</h1>
        <div class="button-wrapper">
            <button id="play-button" class="menu-button">JUGAR</button>
            <button id="settings-button" class="menu-button">AJUSTES</button>
        </div>
    </div>

    <div id="settings" class="screen-container" style="display: none;">
        <h1>AJUSTES</h1>
        
        <div class="settings-options">
            <select id="theme-select" class="menu-select">
                <option value="verde-crt">VERDE CRT</option>
                <option value="ambar">ÁMBAR</option>
                <option value="azul">AZUL</option>
                <option value="blanco">BLANCO</option>
                <option value="negro">NEGRO</option>
            </select>

            <button id="change-device-button" class="menu-button">CAMBIAR DISPOSITIVO</button>
            <button id="reset-data-button" class="menu-button button-danger">RESETEAR DATOS</button>
            <button id="back-button" class="menu-button">VOLVER</button>
        </div>
    </div>


    <div class="version-text">Alfa 1.0</div>

    <script src="Logica.js" type="module"></script>
</body>
</html>
